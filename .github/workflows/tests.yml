name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Qt and backend
        run: python -m pytest tests -q --ignore=tests/test_batch_audition_ui.py --ignore=tests/test_category_navigation_ui.py --ignore=tests/test_bulk_audio_review_ui.py --ignore=tests/test_cutscene_batch_ui.py
      - name: Classic Tk UI
        run: python -m unittest discover -s tests -p "test_*_ui.py" -q
